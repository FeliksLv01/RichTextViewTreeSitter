name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rich-text-view-tree-sitter-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    env:
      COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: brew install xcbeautify cocoapods
      - id: guard
        run: echo "tag=$(./Scripts/release-guard.sh)" >> "$GITHUB_OUTPUT"
      - run: ./Scripts/build-xcframeworks.sh
      - run: ./Scripts/test-swiftpm.sh
      - run: ./Scripts/package-release.sh
      - run: ./Scripts/update-release-metadata.rb
      - run: ./Scripts/test-cocoapods.sh
      - name: Commit release metadata
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Package.swift RichTextViewTreeSitterBinary.podspec
          git diff --cached --quiet || git commit -m "chore(release): prepare ${{ steps.guard.outputs.tag }}"
          git push origin HEAD:main
      - name: Tag and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp Vendor/swift-tree-sitter/LICENSE .build/release/SwiftTreeSitter-LICENSE
          cp Vendor/tree-sitter/LICENSE .build/release/TreeSitter-LICENSE
          cp Vendor/tree-sitter-swift/LICENSE .build/release/TreeSitterSwift-LICENSE
          gh release create "${{ steps.guard.outputs.tag }}" \
            .build/release/*.zip \
            .build/release/*-LICENSE \
            THIRD_PARTY_NOTICES.md \
            --target "$(git rev-parse HEAD)" \
            --generate-notes
      - name: Publish CocoaPods when configured
        if: env.COCOAPODS_TRUNK_TOKEN != ''
        run: pod trunk push RichTextViewTreeSitterBinary.podspec --allow-warnings
